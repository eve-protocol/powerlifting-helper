id: grinchmas_rep_led_2026_v1
created: '2026-10-19'
status: active
previous_focus_archive: state/coaching_focus_2026_jul_oct.yaml
global_goal: >
  Prepare for the December 12, 2026 Grinchmas competition with heavy competition-lift
  practice supported by productive rep work, not obligatory training singles. Preserve
  legal squat depth, genuine bench commands and repeatable sumo starts and lockouts.
  The October 17 reported mock-meet total was 512.5kg with unverified squat/bench
  legality; the 200kg deadlift third failed at the floor. Do not mistake historical
  planning inputs for current demonstrated maxima.
program: december_2026_competition_v1
competition_date: '2026-12-12'
schedule:
  training_days: [monday, tuesday, wednesday, thursday, saturday]
  friday_and_sunday: rest
  week_8_thursday_and_friday: rest
  monday: gym tempo squat, primary bench and weighted pull-ups; condo leg extension and hip thrust later
  tuesday: paused sumo, easy RDL, primary incline dumbbell and row
  wednesday: primary low-bar squat, easy command bench, pull-ups and selected accessory
  thursday: condo chest, shoulders, arms and alternating machine adductor
  saturday: competition sumo, light low-bar squat and Spoto; no added accessories
loading:
  rule: >
    The YAML kg and percentage ranges are directional anchors. Today's symptoms,
    warm-ups, legal positions and prescribed RPE determine the actual load.
    Week 1 is easy but rep-rich after the mock meet; do not add proof attempts.
    Top triples in Weeks 1-5 use the approved RPE bands and actual-top-derived
    backoffs. Weeks 6-7 use doubles and retain normal main-lift rep work; Week 8
    is the sole main-lift taper. No programmed training singles.
  backoffs: >
    Calculate Weeks 1-5 primary backoffs from the actual top triple, then lower
    loads if longer reps exceed the backoff effort cap; do not force tonnage.
  adjustment: >
    An isolated slow set without pain or positional failure is not a cycle rewrite.
    Adjust remaining work minimally when effort/positions require it. Stop heavy
    retries after a miss, escalating pain or significant technical failure.
squat:
  variation: >
    Monday three-second tempo uses the SAME wider low-bar competition stance and
    squat shoes, controlled descent to legal depth and normal strong ascent.
    Wednesday is primary low bar; Saturday is light low bar. Do not import
    narrow-stance or high-bar knee-forward cues from the prior cycle.
  main_cue: Reach legal depth consistently; chest and hips rise together.
  evaluation: Obtain a side or useful quarter angle for heavy depth assessment; front video alone cannot certify depth.
bench:
  priority: >
    Monday primary competition bench and Wednesday low-cost command practice use
    a motionless competition pause with stable touch point, leg drive and press
    symmetry. Saturday Spoto preserves bottom-range tension and leg-drive timing.
    Tuesday incline DB is a primary progression with per-hand loads.
  main_cue: Settle at the touch point, wait for the pause, then press back.
deadlift:
  priority: >
    Tuesday paused sumo stops for a true second at the top edge of the knee with
    bar/legs connected; Saturday sumo is the heavy primary pull. October 17's
    190kg make and 200kg floor-break miss call for repeatable start setup AND
    stacked knee-to-lockout mechanics, not an assumption that floor strength is
    already solved. Keep RDL easy and remove it first if Wednesday squat suffers.
  main_cue: Wedge to break the floor; stay connected through the knee and finish stacked.
accessories:
  normal: Three sets per programmed movement in Weeks 1-6 except RDL at two; pull-ups and primary incline have their own progressions.
  later: Week 7 eases accessories to two sets; Week 8 retains only the programmed easy support.
  machines: Calibrate exact local setups at the prescribed RPE; no assumed cross-machine kg equivalence.
  no_makeup: Never compress skipped support work into the next session.
