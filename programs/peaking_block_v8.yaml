name: Peaking Block v8
description: Three-week athlete-specific realization block. Week 1 expresses heavier singles while retaining doubles and
  primary incline work. Week 2 places the final heavy squat and bench ten days before the mock meet and the final heavy deadlift
  seven days before it. Weeks 1-2 retain a written low-fatigue Friday condo accessory day; Week 3 reduces volume substantially
  and keeps mock-meet-week Friday as full rest. No @9.5 single and no repeated proof attempt.
weeks: 3
days_per_week: 5
planned_start_date: '2026-09-28'
mock_meet_date: '2026-10-17'
mock_meet_targets:
  minimum_total_kg: 512.5
  primary:
    squat_kg: 182.5
    bench_kg: 145
    deadlift_kg: 202.5
    total_kg: 530
  stretch:
    squat_kg: 185
    bench_kg: 147.5
    deadlift_kg: 207.5
    total_kg: 540
load_policy:
  target_weight_role: Anchor from completed strength checkpoints; never override live RPE, pain, setup, or position.
  heavy_single_rule: No single above RPE 9 before mock-meet day and no immediate proof retry after a miss or technical failure.
  taper_rule: Preserve meaningful technique load while reducing pre-meet volume; do not add work because a taper set feels
    easy.
final_week_schedule:
  friday: Full rest. The final bench technique exposure is combined with Wednesday rather than creating a one-exercise trip.
attempt_policy:
  rule: Third-attempt stretch loads are earned by the second attempt, not chosen in advance.
  squat_gate: Chest and hips rise together; no early knee retreat or rescue good morning.
  bench_gate: Stable handoff/unrack, legal pause, no major asymmetric press.
  deadlift_gate: Knees, hips, and shoulders finish stacked; floor speed alone does not justify a jump.
workouts:
- week: 1
  day: 1
  name: Monday - Specific Squat / Paused Bench / Pull-Ups
  intent: Retain useful rep work while reducing fatigue and increasing competition specificity.
  priority: required
  exercises:
  - name: Squat (Low Bar)
    intent: Keep competition-squat positions active without adding a second heavy squat day.
    role: competition_lift
    sets:
    - target: 3
      rpe:
      - 6
      - 6.5
      target_weight_kg: 145
    - target: 3
      rpe:
      - 6
      - 6.5
      target_weight_kg: 145
  - name: Bench Press (Paused)
    intent: Retain long-pause pressing strength through controlled triples.
    role: primary_bench
    sets:
    - target: 3
      rpe:
      - 6.5
      - 7
      target_weight_kg: 112.5
    - target: 3
      rpe:
      - 6.5
