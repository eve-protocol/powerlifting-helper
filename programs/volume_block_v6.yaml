name: Volume Block v6
description: "4-week accumulation block (8s \u2192 6s \u2192 5s \u2192 5RM benchmark).\
  \ Monday moves to paused bench + high bar squat to fix Saturday deadlift \u2192\
  \ Monday fatigue. Heavy low bar sits Wednesday for max recovery. 4 bench exposures:\
  \ paused (Mon), incline DB (Tue), competition (Thu), Larsen (Sat). Pull-ups twice\
  \ weekly. Straight sets throughout \u2014 no potentiation singles. Week 1 RPE is\
  \ deliberately low for post-mock-meet re-entry."
