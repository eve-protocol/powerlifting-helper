name: Volume Block v6
description: '4-week accumulation block kept close to volume_block_v5: 3 squat exposures
  (2 low-bar, 1 high-bar), 4 bench exposures (paused, incline DB, competition bench,
  Spoto), and 2 deadlift exposures while avoiding extra lower-back fatigue. Week 1
  re-enters with controlled 8s, then 6s, 5-rep prep, and week-4 5RM benchmarks. Face
  pulls removed; pull-ups stay twice weekly.'
