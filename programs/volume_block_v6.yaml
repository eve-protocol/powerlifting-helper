name: Volume Block v6
description: 4-week accumulation block inspired by accumulation/transmutation/realization periodization. Easier post-mock-meet re-entry, high-bar squat emphasis, x8-x10 bench/squat volume, Tuesday deadlift to protect Monday recovery, pull-ups twice weekly, and machine chest/rear-delt work instead of face pulls.
