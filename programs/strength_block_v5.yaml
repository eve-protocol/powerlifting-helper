name: Strength Block v5
description: '4-week strength block kept close to strength_block_v4 while extending
  to the 4-week cycle: 3 squat exposures with low-bar twice and high-bar once, 4 bench
  exposures, and 2 deadlift exposures. One low-bar exposure stays light on Saturday
  to avoid turning the heavy deadlift day into another hard squat day. No RDL stacking
  after deadlifts; face pulls removed.'
weeks: 4
days_per_week: 5
workouts:
- week: 1
  day: 1
  name: Monday - Heavy Low Bar / Paused Bench
  exercises:
  - name: Squat (Low Bar)
    type: Barbell
    muscles:
    - Legs
    sets:
    - target: 1
      rpe:
      - 7
      - 7.5
    - target: 4
      rpe:
      - 7
      - 7.5
    - target: 4
      rpe:
      - 7
      - 7.5
  - name: Bench Press (Paused)
    type: Barbell
    muscles:
    - Chest
    sets:
    - target: 4
      rpe:
      - 6.5
      - 7
    - target: 4
      rpe:
      - 6.5
      - 7
    - target: 4
      rpe:
      - 6.5
      - 7
  - name: Cable Crunch
    type: Machine
    muscles:
    - Core
    sets:
    - target: 12
      rpe:
      - 7
      - 7.5
    - target: 12
      rpe:
      - 7
      - 7.5
  - name: Pull-Up (Weighted)
