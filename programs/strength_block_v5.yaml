name: Strength Block v5
description: "4-week transmutation block (4s \u2192 3s \u2192 3s heavier \u2192 3RM\
  \ benchmark). Potentiation singles return on heavy days (Wed squat, Thu bench, Sat\
  \ deadlift), but benchmark week uses opener-like singles before top triples rather\
  \ than max-effort singles plus max-effort backoffs. Monday variation becomes pause\
  \ squat (low bar) for hole strength specificity. Same day structure as accumulation\
  \ for consistency. Incline DB stays as serious bench exposure. Pull-ups twice weekly."
weeks: 4
days_per_week: 5
