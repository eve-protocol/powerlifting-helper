name: December 2026 Competition - Ren v1
description: Eight-week meet-specific cycle built from the athlete-calibrated 5-week top-triple progression in REN_3.xlsx;
  three squat exposures, Saturday heavy sumo, Thursday incline, Friday rest. Proposal for review, not Boostcamp-synced.
weeks: 8
days_per_week: 5
planned_start_date: '2026-10-19'
competition_date: '2026-12-12'
schedule:
  monday: Primary competition bench / high bar / weighted pull-ups; condo leg extension and adductor later
  tuesday: Paused-at-knee sumo / supported row
  wednesday: Heavy low bar then low-cost competition bench commands; pull-ups afterward
  thursday: Primary incline dumbbell and upper-body support
  friday: Full rest before heavy deadlift
  saturday: Heavy sumo then light low bar then Spoto / hip thrust
  sunday: Rest
loading_guidance:
  e1rm_proxy_kg:
    squat_low_bar: 180
    competition_bench: 142.5
    sumo_deadlift: 190
  proxy_scope: October 17 reported successful singles used as conservative initial proxies, NOT measured or calibrated
    e1RMs. Bench and squat judge legality remains unverified. Recalibrate from Week 1 actual effort; percentage
    ranges never override RPE or position.
  top_triples_weeks_1_to_5:
  - week: 1
    rpe: 6.5
    e1rm_pct_range:
    - 0.81
    - 0.835
    backoff_multiplier_of_actual_top_set: 0.9
  - week: 2
    rpe: 7
    e1rm_pct_range:
    - 0.825
    - 0.85
    backoff_multiplier_of_actual_top_set: 0.9
  - week: 3
    rpe: 7.5
    e1rm_pct_range:
    - 0.84
    - 0.865
    backoff_multiplier_of_actual_top_set: 0.89
  - week: 4
    rpe: 8
    e1rm_pct_range:
    - 0.855
    - 0.88
    backoff_multiplier_of_actual_top_set: 0.88
  - week: 5
    rpe: 8.5
    e1rm_pct_range:
    - 0.87
    - 0.895
    backoff_multiplier_of_actual_top_set: 0.86
  backoff_rule: For Monday bench, Wednesday squat and Saturday sumo, derive backoff load from ACTUAL top triple,
    round to 2.5kg, and check target RPE. The numerical backoff in a workout is only an illustrative anchor if the
    suggested top set is actually used.
  day_to_day_rule: Use the range as a starting estimate and adjust to the written RPE and legal lift quality; no
    proof retries after a miss. Machine anchors are omitted pending local setup calibration.
  week_6: Competition singles @7-8 followed by limited doubles/triples; do not turn this into a max test.
  week_7: Final heavy controlled bench Monday, squat Wednesday, deadlift Saturday, singles @8-8.5 maximum; earn
    load on warm-ups.
  week_8: Brief low-RPE competition touches only, no Thursday/Friday session; meet attempts selected from actual
    warm-ups and judged makes.
exercise_variations:
  squat: High Bar Squat (Barbell) retained Monday instead of adding paused/tempo squat; low-bar Wednesday and Saturday
    yield three exposures. Alternate pause/tempo by replacement after evidence, not on top.
  deadlift: Sumo Deadlift (Paused) at knee retained Tuesday for competition-specific knee-to-lockout; RDL, B-stance,
    unilateral and Zercher are possible replacements after assessment, not simultaneous additions.
  bench: Primary competition bench Monday BEFORE high bar, controlled command-style competition bench Wednesday
    after squat, Spoto Saturday; primary incline DB Thursday with its own progression. Close-grip from friend sheet
    replaced by competition pause practice.
  adductor: Use one hip-adductor option per week, not both. Exact user-provided custom name Hip adductor (Rowerg)
    is case-sensitive.
condo_policy: Monday leg extension and the single selected adductor variation may be completed after returning home;
  Saturday machine hip thrust may follow the gym session. Log them under the intended workout. Thursday contains
  no lower-body fatigue that threatens Saturday.
meet_policy: Local competition, 83kg class with no cut planned; weigh-in and federation details to confirm before
  attempt-day logistics. Do not assume mock-meet attempts are white-light legal.
workouts:
- week: 1
  day: 1
  name: Monday - Primary Bench / High Bar / Pull-Ups + Condo Legs
  intent: Friend-template bench top triple first, first squat exposure afterward, pull-ups; condo timing for written
    leg support.
  priority: required
  exercises:
  - name: Bench Press (Barbell)
    intent: PRIMARY bench top set before squatting, widest legal grip with an actual command pause; backdowns from
      the actual top-set load.
    role: competition_lift
    sets:
    - target: 3
      rpe:
      - 6
      - 6.5
      target_weight_kg: 117.5
    - target: 3
      rpe:
      - 6
      - 7.5
      target_weight_kg: 105.0
    - target: 3
      rpe:
      - 6
      - 7.5
      target_weight_kg: 105.0
  - name: High Bar Squat (Barbell)
    intent: Shoes; knee forward, chest and hips rise together; developmental squat, not extra low-bar intensity.
    role: developmental_squat
    sets:
    - target: 5
      rpe:
      - 6
      - 6.5
      target_weight_kg: 115
    - target: 5
      rpe:
      - 6
      - 6.5
      target_weight_kg: 115
  - name: Pull-Up (Weighted)
    intent: First of two meaningful weekly pull-up sessions, external load only.
    role: secondary_goal
    sets:
    - target: 5
      rpe:
      - 6.5
      - 7.5
      target_weight_kg: 20
    - target: 5
      rpe:
      - 6.5
      - 7.5
      target_weight_kg: 20
  - name: Leg Extension
    intent: Condo machine after returning home; full comfortable ROM; leave reps in reserve.
    role: accessory
    sets:
    - target: 12
      rpe:
      - 6
      - 7
    equipment_dependent: true
- week: 1
  day: 2
  name: Tuesday - Paused Sumo / Supported Row
  intent: Second sumo exposure, deliberately cheaper than Saturday; preserve Wednesday squat.
  priority: required
  exercises:
  - name: Sumo Deadlift (Paused)
    intent: Pause one true second when bar reaches top edge of knee; keep legs/bar connected then hips through.
      No exploratory heavy pull.
    role: developmental_deadlift
    sets:
    - target: 3
      rpe:
      - 5.5
      - 6.5
      target_weight_kg: 140
    - target: 3
      rpe:
      - 5.5
      - 6.5
      target_weight_kg: 140
  - name: Seated Row (Cable)
    intent: Supported upper-back work, moderate grip/torso cost before Wednesday.
    role: accessory
    sets:
    - target: 10
      rpe:
      - 6.5
      - 7.5
    equipment_dependent: true
- week: 1
  day: 3
  name: Wednesday - Competition Squat / Bench / Pull-Ups
  intent: Meet-order main lifts with NO support between them; at most two support exercises after. Squat uses calibrated
    top triples and actual-top backdowns; bench remains low-cost after squat.
  priority: required
  exercises:
