      - 6.5
      target_weight_kg: 147.5
    - target: 3
      rpe:
      - 6
      - 7.5
      target_weight_kg: 132.5
  - name: Bench Press (Barbell)
    intent: Immediately after squat in meet order; stable handoff/unrack, widest legal grip, motionless command
      pause; this is LOW COST practice, not a second bench top-set day.
    role: competition_lift
    sets:
    - target: 3
      rpe:
      - 6
      - 7
      target_weight_kg: 110
    - target: 3
      rpe:
      - 6
      - 7
      target_weight_kg: 110
    - target: 3
      rpe:
      - 6
      - 7
      target_weight_kg: 110
  - name: Pull-Up (Weighted)
    intent: Second weekly weighted pull-up; after both competition lifts, not between them.
