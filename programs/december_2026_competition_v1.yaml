name: December 2026 Competition - Ren v1
description: 'Eight-week rep-led Grinchmas preparation: preserve the Ren-calibrated Week 1-5 top triples and actual-top
  backoff loading, restore productive backoff/variation reps, then competition doubles rather than programmed training
  singles. Same exercise identities and weekly schedule; Week 7 remains normal training and only Week 8 tapers.
  Draft review only, not activated or manually Boostcamp-synced.'
weeks: 8
days_per_week: 5
planned_start_date: '2026-10-19'
competition_date: '2026-12-12'
schedule:
  monday: Primary competition bench / same-wide-stance tempo squat / weighted pull-ups; condo leg extension and
    hip thrust later
  tuesday: Paused-at-knee sumo / easy Romanian-deadlift backoff / PRIMARY incline dumbbell / supported row in Weeks
    1-7; competition sumo / incline / row in meet week
  wednesday: Heavy low bar then low-cost competition bench commands; pull-ups and gym-only RowErg adductor on alternate
    weeks
  thursday: 'Condo-only accessories: chest, shoulders, arms and machine adductor on alternate weeks'
  friday: Full rest before heavy deadlift
  saturday: 'Barbell SBD only: heavy sumo then light low bar then Spoto bench'
  sunday: Rest
loading_guidance:
  e1rm_proxy_kg:
    squat_low_bar: 180
    competition_bench: 142.5
    sumo_deadlift: 200
  proxy_scope: 'Squat 180 and bench 142.5 are October 17 reported singles with unverified meet legality. Deadlift
    200 is Ren-selected historical successful single (2025-08-25 synced), NOT an October 17 make: 190 was made and
    200 missed then. These are initial input proxies, NOT measured current e1RMs. Recalibrate from Week 1 actual
    effort; percentage ranges never override RPE or position.'
  top_triples_weeks_1_to_5:
  - week: 1
    rpe: 6.5
    e1rm_pct_range:
    - 0.81
    - 0.835
    backoff_multiplier_of_actual_top_set: 0.9
  - week: 2
    rpe: 7
    e1rm_pct_range:
    - 0.825
    - 0.85
    backoff_multiplier_of_actual_top_set: 0.9
  - week: 3
    rpe: 7.5
    e1rm_pct_range:
    - 0.84
    - 0.865
    backoff_multiplier_of_actual_top_set: 0.89
  - week: 4
    rpe: 8
    e1rm_pct_range:
    - 0.855
    - 0.88
    backoff_multiplier_of_actual_top_set: 0.88
  - week: 5
    rpe: 8.5
    e1rm_pct_range:
    - 0.87
    - 0.895
    backoff_multiplier_of_actual_top_set: 0.86
  backoff_rule: Weeks 1-5 primary bench/squat/sumo backoff loads start from 90/90/89/88/86% of the ACTUAL top triple,
    half-up rounded to 2.5kg. Normal Weeks 2-3 use five-rep backoffs and Weeks 4-5 fours, with two squat/sumo backoff
    sets retained; bench uses three. Reassess RPE for the longer sets and lower load below the percentage example
    if needed. Weeks 6-8 doubles/backoffs use separately selected fixed planning anchors, not an actual-top-triple
    percentage.
  day_to_day_rule: Use the range as a starting estimate and adjust to the written RPE and legal lift quality; the
    historical 200kg deadlift input is not a current max guarantee. No proof retries after a miss. Machine anchors
    are omitted pending local setup calibration.
  week_6: 'Rep-led specificity: one competition DOUBLE @7-8, then meaningful fours/fives. Normal secondary rep work
    remains; no programmed primer or top singles, no proof attempts.'
  week_7: 'NOT a taper: retain Week 6 set and rep counts, with only a small RPE-governed rise in double/backoff
    anchors. Top doubles cap at RPE 8.5. Preserve Saturday light squat reps and normal Tuesday primary incline;
    no work-set singles or proof retries.'
  week_8: 'SOLE taper week: low-fatigue competition doubles plus bounded rep backoffs on Monday bench, Tuesday sumo
    and Wednesday squat; Wednesday easy bench fours. Keep familiar tempo/pull-ups and easy Monday condo work; Thursday/Friday
    off. Compare with the revised Week 7, excluding meet attempts: retain at least half of total work sets and barbell-strength
    sets/reps/expected tonnage (including RDL in the latter scope). This is a planning preference, not permission
    to force fatigued reps or chase tonnage.'
  anchor_range_rule: Weeks 1-5 primary top triples retain the exact workbook percentage bands and independently
    2.5kg-rounded endpoints. Choose from warm-ups, RPE and legal positions; no duty to hit the top of the band.
    Backoffs are recalculated from the ACTUAL triple and adjusted for their longer rep target. Weeks 6-8 retain
    scalar, RPE-governed anchors specifically reselected for doubles and their backoffs; do not repeat former single
    weights for more reps.
  percentage_display_rule: load_percent is a percentage-point number or [min,max] per set, always paired with load_percent_of.
    Weeks 1-5 primary top triples retain original workbook bands; backoffs use the stated percentage of the ACTUAL
    top triple, not of the planning max. Other squat/bench/sumo and variation percentages are indicative ratios
    of existing kg anchors to the relevant COMPETITION-lift input, rounded to two decimals; they are not variation
    1RMs or extra percentage prescriptions. RPE and legal positions remain decisive. Do not assign percentages to
    RDL, incline DB, pull-ups, machines or unknown meet attempts without a defensible reference. These fields and
    kg ranges render in local program docs/coaching scripts; Boostcamp retains reps/RPE only.
  rep_led_rule: No programmed single-repetition training sets; the nine competition attempts remain singles. Warm-up
    reps are not an extra performance test. Heavy doubles/triples provide specific practice while moderate-RPE rep
    work supplies the main restored dose; neither singles nor exact tonnage are universally required for strength
    gains.
exercise_variations:
  squat: Tempo Squat (Barbell) REPLACES Monday high bar. Use the same wider low-bar competition stance and shoes,
    three-second controlled descent to legal depth, normal strong ascent; do not force maximal knee-forward travel.
    Wednesday and Saturday low bar yield three weekly exposures.
  deadlift: Tuesday paused-at-knee sumo retains positional triples in normal weeks, with the existing easy 1-2 RDL
    backoff sets only. Most restored competition-pull volume is Saturday. Meet-week Tuesday uses a low-fatigue competition
    double and two easy five-rep backoffs without RDL. If Wednesday squat quality deteriorates, remove the RDL first.
    No new hinge variations or extra pulling days.
  bench: Primary competition bench Monday BEFORE tempo squat, PRIMARY incline DB after Tuesday pulls, controlled
    command-style competition bench Wednesday after squat, Spoto Saturday. Close-grip from friend sheet replaced
    by competition pause practice.
  adductor: 'Use one hip-adductor option per week, not both: Hip adductor (Rowerg) on Wednesday at Back Alley Barbell
    in even development weeks; Hip Adductor (Machine) on Thursday at the condo in odd development weeks. Exact custom
    RowErg capitalization is case-sensitive.'
condo_policy: Monday is three gym movements plus two condo movements (leg extension and hip thrust), an explicit
  exception to the four-movement cap. Wednesday RowErg adductor is gym-only; Thursday condo machine adductor occurs
  on alternate weeks, never in the same week. Saturday is ONLY sumo, low-bar squat and Spoto bench; no condo hip
  thrust after. Log condo work under Monday/Thursday. Keep hip/adductor work low-soreness to protect next primary
  squat and Saturday sumo.
meet_policy: Local competition, 83kg class with no cut planned; weigh-in and federation details to confirm before
  attempt-day logistics. Do not assume mock-meet attempts are white-light legal.
workload_summary:
  scope_note: 'Expected barbell SBD-family workload, including the listed variations. This is not all-exercise gym
    tonnage: RDL, incline dumbbells, pull-ups and machines are excluded. Competition attempts are shown in the session
    plan but excluded from pre-meet training comparisons.'
  families:
    Squat:
    - Squat (Low Bar)
    - Tempo Squat (Barbell)
    Bench:
    - Bench Press (Barbell)
    - Spoto Press
    Deadlift:
    - Sumo Deadlift (Barbell)
    - Sumo Deadlift (Paused)
  plate_increment_kg: 2.5
  exclude_workouts:
  - week: 8
    day: 5
    reason: Grinchmas competition attempts; not pre-meet training
