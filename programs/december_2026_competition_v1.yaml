  name: Monday - Competition Bench / Tempo Squat / Pull-Ups + Two Easy Condo Machines
  intent: 'Substantive but bounded final-week work: one clean competition single and rep backoffs, familiar tempo,
    pull-ups, then easy condo leg extension and hip thrust. No soreness chase.'
  priority: required
  exercises:
  - name: Bench Press (Barbell)
    intent: Meet-pause single @7-8 and two submaximal triples; calibrate from actual warm-ups, no grinder or proof
      retry.
    role: competition_lift
    sets:
    - target: 1
      rpe:
      - 7
      - 8
      target_weight_kg: 130
    - target: 3
      rpe:
      - 6
      - 7.5
      target_weight_kg: 115
    - target: 3
      rpe:
      - 6
      - 7.5
      target_weight_kg: 115
  - name: Tempo Squat (Barbell)
    intent: Familiar wider low-bar stance and controlled descent; 3x3 around 115 only while positions stay crisp,
      normal ascent.
    role: developmental_squat
    sets:
    - target: 3
      rpe:
      - 6
      - 7
      target_weight_kg: 115
    - target: 3
      rpe:
      - 6
      - 7
      target_weight_kg: 115
    - target: 3
      rpe:
      - 6
      - 7
      target_weight_kg: 115
  - name: Pull-Up (Weighted)
    intent: Familiar, low-cost pulling; added weight, no failure.
    role: secondary_goal
    sets:
    - target: 4
      rpe:
      - 6
      - 7
      target_weight_kg: 15
    - target: 4
      rpe:
      - 6
      - 7
      target_weight_kg: 15
  - name: Leg Extension
    intent: Condo, comfortable full ROM; one familiar easy set, no lingering quad soreness.
    role: accessory
    sets:
    - target: 12
      rpe:
      - 6
      - 6.5
    equipment_dependent: true
  - name: Hip Thrust (Machine)
    intent: Condo with leg extension; one familiar easy set, no Tuesday/Wednesday hip soreness.
    role: accessory
    sets:
    - target: 10
      rpe:
      - 6
      - 6.5
    equipment_dependent: true
- week: 8
  day: 2
  name: Tuesday - Competition Sumo / Incline DB / Supported Row
  intent: Competition-pull confidence exposure four days before meet with a single @7-8 and easy triples, plus familiar
    primary incline and a low-cost row. No RDL, no heavy retry.
  priority: required
  exercises:
  - name: Sumo Deadlift (Barbell)
    intent: 'Meet setup and lockout: single @7-8, then two clean triples @6-7. If the first pull loses position
      or is much harder than intended, reduce/omit backoffs rather than retest.'
    role: competition_lift
    sets:
    - target: 1
      rpe:
      - 7
      - 8
      target_weight_kg: 175
    - target: 3
      rpe:
      - 6
      - 7
      target_weight_kg: 150
    - target: 3
      rpe:
      - 6
      - 7
      target_weight_kg: 150
  - name: Incline Bench Press (Dumbbell)
    intent: Still a meaningful familiar press, but stop short of Wednesday bench fatigue; per hand.
    role: primary_bench
    sets:
    - target: 5
      rpe:
      - 6
      - 7
      target_weight_kg: 45
    - target: 5
      rpe:
      - 6
      - 7
      target_weight_kg: 45
  - name: Seated Row (Cable)
    intent: One easy familiar supported row set, no grip/back-fatigue chase.
    role: accessory
    sets:
    - target: 10
      rpe:
      - 6
      - 7
    equipment_dependent: true
- week: 8
  day: 3
  name: Wednesday - Competition Squat / Bench Commands / Pull-Ups
  intent: Meet-order main lifts with NO support between them; at most two support exercises after. Squat uses top
    triples and actual-top backdowns Weeks 1-5, then controlled singles and bounded backoffs; bench remains low-cost
    after squat.
  priority: required
  exercises:
  - name: Squat (Low Bar)
    intent: Primary wider-stance competition squat in shoes; establish legal depth, balanced midfoot and knees tracking
      over feet; chest and hips rise together without forced knee-forward travel. Top load from RPE and first-set
      quality.
    role: competition_lift
    sets:
    - target: 1
      rpe:
      - 7
      - 8
      target_weight_kg: 165
    - target: 2
      rpe:
      - 6
      - 7
      target_weight_kg: 145
    - target: 2
      rpe:
      - 6
      - 7
      target_weight_kg: 145
  - name: Bench Press (Barbell)
    intent: Immediately after squat in meet order; stable handoff/unrack, widest legal grip, motionless command
      pause; this is LOW COST practice, not a second bench top-set day.
    role: competition_lift
    sets:
    - target: 2
      rpe:
      - 6
      - 7
      target_weight_kg: 115
    - target: 2
      rpe:
      - 6
      - 7
      target_weight_kg: 115
  - name: Pull-Up (Weighted)
    intent: One familiar easy set after both competition lifts; keep grip and elbows fresh for Saturday.
    role: secondary_goal
    sets:
    - target: 4
      rpe:
      - 6
      - 7
      target_weight_kg: 15
