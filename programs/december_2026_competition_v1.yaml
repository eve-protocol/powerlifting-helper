  day: 4
  name: Thursday - Primary Incline DB / Upper Accessories
  intent: Condo or powerlifting gym; Friday full rest, so no heavy lower-body, grip or rows here.
  priority: required
  exercises:
  - name: Incline Bench Press (Dumbbell)
    intent: PRIMARY incline progression, per hand; full ROM, own load/rep checkpoint; do not turn into junk volume
