name: December 2026 Competition - Ren v1
description: Eight-week meet-specific cycle built from the athlete-calibrated 5-week top-triple progression in REN_3.xlsx;
  three squat exposures including same-stance tempo, Saturday heavy sumo, Thursday incline, Friday rest. Proposal
  for review, not Boostcamp-synced.
weeks: 8
days_per_week: 5
planned_start_date: '2026-10-19'
competition_date: '2026-12-12'
schedule:
  monday: Primary competition bench / same-wide-stance tempo squat / weighted pull-ups; condo leg extension and
    adductor later
  tuesday: Paused-at-knee sumo / easy Romanian-deadlift backoffs / supported row
  wednesday: Heavy low bar then low-cost competition bench commands; pull-ups afterward
  thursday: Primary incline dumbbell and upper-body support
  friday: Full rest before heavy deadlift
  saturday: Heavy sumo then light low bar then Spoto / hip thrust
  sunday: Rest
loading_guidance:
  e1rm_proxy_kg:
    squat_low_bar: 180
    competition_bench: 142.5
    sumo_deadlift: 200
  proxy_scope: 'Squat 180 and bench 142.5 are October 17 reported singles with unverified meet legality. Deadlift
    200 is Ren-selected historical successful single (2025-08-25 synced), NOT an October 17 make: 190 was made and
    200 missed then. These are initial input proxies, NOT measured current e1RMs. Recalibrate from Week 1 actual
    effort; percentage ranges never override RPE or position.'
  top_triples_weeks_1_to_5:
  - week: 1
    rpe: 6.5
    e1rm_pct_range:
    - 0.81
    - 0.835
    backoff_multiplier_of_actual_top_set: 0.9
  - week: 2
    rpe: 7
    e1rm_pct_range:
    - 0.825
    - 0.85
    backoff_multiplier_of_actual_top_set: 0.9
  - week: 3
    rpe: 7.5
    e1rm_pct_range:
    - 0.84
    - 0.865
    backoff_multiplier_of_actual_top_set: 0.89
  - week: 4
    rpe: 8
    e1rm_pct_range:
    - 0.855
    - 0.88
    backoff_multiplier_of_actual_top_set: 0.88
  - week: 5
    rpe: 8.5
    e1rm_pct_range:
    - 0.87
    - 0.895
    backoff_multiplier_of_actual_top_set: 0.86
  backoff_rule: For Monday bench, Wednesday squat and Saturday sumo, derive backoff load from ACTUAL top triple,
    round to 2.5kg, and check target RPE. The numerical backoff in a workout is only an illustrative anchor if the
    suggested top set is actually used.
  day_to_day_rule: Use the range as a starting estimate and adjust to the written RPE and legal lift quality; the
    historical 200kg deadlift input is not a current max guarantee. No proof retries after a miss. Machine anchors
    are omitted pending local setup calibration.
  week_6: Competition singles @7-8 followed by limited doubles/triples; do not turn this into a max test.
  week_7: Final heavy controlled bench Monday, squat Wednesday, deadlift Saturday, singles @8-8.5 maximum; earn
    load on warm-ups.
  week_8: Brief low-RPE competition touches only, no Thursday/Friday session; meet attempts selected from actual
    warm-ups and judged makes.
exercise_variations:
  squat: Tempo Squat (Barbell) REPLACES Monday high bar. Use the same wider low-bar competition stance and shoes,
    three-second controlled descent to legal depth, normal strong ascent; do not force maximal knee-forward travel.
    Wednesday and Saturday low bar yield three weekly exposures.
  deadlift: Sumo Deadlift (Paused) at knee remains Tuesday for knee-to-lockout; Romanian Deadlift (Barbell) is a
    deliberately easy 1-2 set BACKOFF afterward in development weeks, not another hard primary pull. If Wednesday
    squat quality deteriorates, remove the RDL backoff rather than add it to Saturday. B-stance, unilateral and
    Zercher are not concurrently added.
  bench: Primary competition bench Monday BEFORE tempo squat, controlled command-style competition bench Wednesday
    after squat, Spoto Saturday; primary incline DB Thursday with its own progression. Close-grip from friend sheet
    replaced by competition pause practice.
  adductor: Use one hip-adductor option per week, not both. Exact user-provided custom name Hip adductor (Rowerg)
    is case-sensitive.
condo_policy: Monday leg extension and the single selected adductor variation may be completed after returning home;
  Saturday machine hip thrust may follow the gym session. Log them under the intended workout. Thursday contains
  no lower-body fatigue that threatens Saturday.
meet_policy: Local competition, 83kg class with no cut planned; weigh-in and federation details to confirm before
  attempt-day logistics. Do not assume mock-meet attempts are white-light legal.
workouts:
- week: 1
  day: 1
  name: Monday - Primary Bench / Tempo Squat / Pull-Ups + Condo Legs
  intent: Friend-template bench top triple first, same-stance tempo squat afterward, pull-ups; condo timing for
    written leg support.
  priority: required
  exercises:
  - name: Bench Press (Barbell)
    intent: PRIMARY bench top set before squatting, widest legal grip with an actual command pause; backdowns from
      the actual top-set load.
    role: competition_lift
    sets:
    - target: 3
      rpe:
      - 6
      - 6.5
      target_weight_kg: 117.5
    - target: 3
      rpe:
      - 6
      - 7.5
      target_weight_kg: 105.0
    - target: 3
      rpe:
      - 6
      - 7.5
      target_weight_kg: 105.0
  - name: Tempo Squat (Barbell)
    intent: 'SAME wider low-bar competition stance in squat shoes: controlled three-second eccentric, decisive reversal
      at legal depth, normal ascent with chest and hips together. No demand for extra knee-forward travel.'
    role: developmental_squat
    sets:
    - target: 5
      rpe:
      - 6
      - 6.5
      target_weight_kg: 110
    - target: 5
      rpe:
      - 6
      - 6.5
      target_weight_kg: 110
  - name: Pull-Up (Weighted)
    intent: First of two meaningful weekly pull-up sessions, external load only.
    role: secondary_goal
    sets:
    - target: 5
      rpe:
      - 6.5
      - 7.5
      target_weight_kg: 20
    - target: 5
      rpe:
      - 6.5
      - 7.5
      target_weight_kg: 20
  - name: Leg Extension
    intent: Condo machine after returning home; full comfortable ROM; leave reps in reserve.
    role: accessory
    sets:
    - target: 12
      rpe:
      - 6
      - 7
    equipment_dependent: true
