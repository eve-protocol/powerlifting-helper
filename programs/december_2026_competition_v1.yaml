name: December 2026 Competition - Ren v1
description: 'Eight-week rep-led Grinchmas preparation: easy but rep-rich Week 1; Ren-calibrated Week 1-5 top triples
  and actual-top backoffs; competition doubles plus controlled command-pause bench singles late in the block. Normal accessories use three
  sets, RDL two; pull-ups and primary incline retain their own paths. From Week 2, Saturday RDL follows the competition
  sumo top set and two backoffs, replacing Tuesday RDL; Monday secondary command-bench anchors rise within RPE 6-7. Week 7
  preserves main-lift work with modest accessory easing; Week 8 is the sole main-lift taper. From Week 2 primary competition squat and bench share Wednesday; Monday bench is secondary after tempo squat.'
weeks: 8
days_per_week: 5
planned_start_date: '2026-10-19'
competition_date: '2026-12-12'
schedule:
  monday: Same-wide-stance tempo squat / low-cost command bench / weighted pull-ups; condo leg extension and
    hip thrust later in Weeks 2-7; completed Week 1 and meet-week taper keep their existing bench prescriptions
  tuesday: Paused-at-knee sumo / PRIMARY incline dumbbell / supported row in Weeks 2-7; Week 1 included two completed
    RDL backoffs; competition sumo / incline / row in meet week
  wednesday: Primary low bar then primary competition bench top/backoffs with commands in Weeks 2-7; pull-ups and
    gym-only RowErg adductor on alternate weeks; meet week retains easy commands
  thursday: 'Condo-only accessories: chest, shoulders, arms and machine adductor on alternate weeks'
  friday: Full rest before heavy deadlift
  saturday: 'Week 1: heavy sumo then light low bar then Spoto; Weeks 2-7: heavy sumo top/backoffs then two easy RDLs, light low bar, Spoto'
  sunday: Rest
loading_guidance:
  e1rm_proxy_kg:
    squat_low_bar: 180
    competition_bench: 142.5
    sumo_deadlift: 200
  proxy_scope: 'Squat 180 and bench 142.5 are October 17 reported singles with unverified meet legality. Deadlift
    200 is Ren-selected historical successful single (2025-08-25 synced), NOT an October 17 make: 190 was made and
    200 missed then. These are initial input proxies, NOT measured current e1RMs. Recalibrate from Week 1 actual
    effort; percentage ranges never override RPE or position.'
  top_triples_weeks_1_to_5:
  - week: 1
    rpe: 6.5
    e1rm_pct_range:
    - 0.81
    - 0.835
    backoff_multiplier_of_actual_top_set: 0.9
  - week: 2
    rpe: 7
    e1rm_pct_range:
    - 0.825
    - 0.85
    backoff_multiplier_of_actual_top_set: 0.9
  - week: 3
    rpe: 7.5
    e1rm_pct_range:
    - 0.84
    - 0.865
    backoff_multiplier_of_actual_top_set: 0.89
  - week: 4
    rpe: 8.5
    e1rm_pct_range:
    - 0.87
    - 0.895
    backoff_multiplier_of_actual_top_set: 0.88
  - week: 5
    rpe: 7.5
    e1rm_pct_range:
    - 0.825
    - 0.85
    backoff_multiplier_of_actual_top_set: 0.9
  backoff_rule: Weeks 1-5 primary bench/squat/sumo backoff loads start from 90/90/89/88/90% of the ACTUAL top triple,
    half-up rounded to 2.5kg. Week 1 uses two easy five-rep backoffs per primary lift at RPE 6-7; Weeks 2-3 use
    fives and Weeks 4-5 fours, retaining two squat/sumo backoffs and three bench backoffs in normal weeks. Lower
    the starting load if longer sets exceed their effort cap. Weeks 6-8 doubles/backoffs use separately selected
    anchors, not an actual-top-triple percentage; Weeks 6-7 add one bounded bench single before the double and
    Week 8 substitutes a low-fatigue bench single for its Monday double.
  day_to_day_rule: Use the range as a starting estimate and adjust to the written RPE and legal lift quality; the
    historical 200kg deadlift input is not a current max guarantee. No proof retries after a miss. Machine anchors
    are omitted pending local setup calibration.
  week_6: 'Rep-led specificity: squat and sumo doubles @7-8; Wednesday bench has one command-pause single @6.5-7.5
    before the preserved double @7-8 and three fours. Normal secondary rep work remains; no proof attempts.'
  week_7: 'Main-lift work is NOT tapered: retain Week 6 SBD-family sets/reps with a small RPE-governed load rise.
    Accessories ease from three sets to two; RDL remains two easy sets. Top doubles cap at RPE 8.5; primary incline/pull-ups
    keep their own paths. Wednesday bench adds one command-pause single @7-8 before its preserved double/backoffs. No proof attempts.'
  week_8: 'SOLE main-lift taper week: Monday bench has one low-fatigue command-pause single @6-7 INSTEAD OF its double,
    then the original three easy fours; Tuesday sumo and Wednesday squat retain doubles/backoffs, Wednesday bench two
    easy fours. Keep familiar support and Thursday/Friday rest. The new bench specificity changes scalar tonnage
    and total-set retention against Week 7 slightly beyond the prior half-retention planning preference; never pad
    meet week or chase tonnage to satisfy a ratio. No opener test or proof retry.'
  anchor_range_rule: Weeks 1-3 primary top triples retain the workbook percentage bands and independently
    2.5kg-rounded endpoints; Week 4 advances to the first-wave peak band and Week 5 deliberately resets to the lighter
    band after Ren's correction. Choose from warm-ups, RPE and legal positions; no duty to hit the top of any band.
    Backoffs are recalculated from the ACTUAL triple and adjusted for their longer rep target. Weeks 6-8 retain
    scalar, RPE-governed anchors specifically reselected for doubles and their backoffs; do not repeat former single
    weights for more reps.
  percentage_display_rule: load_percent is a percentage-point number or [min,max] per set, always paired with load_percent_of.
    Weeks 1-3 primary top triples retain original workbook bands, Weeks 4-5 the revised peak/reset bands; backoffs use the stated percentage of the ACTUAL
    top triple, not of the planning max. Other squat/bench/sumo and variation percentages are indicative ratios
    of existing kg anchors to the relevant COMPETITION-lift input, rounded to two decimals; they are not variation
    1RMs or extra percentage prescriptions. RPE and legal positions remain decisive. Do not assign percentages to
    RDL, incline DB, pull-ups, machines or unknown meet attempts without a defensible reference. These fields and
    kg ranges render in local program docs/coaching scripts; Boostcamp retains reps/RPE only.
  rep_led_rule: Only Wednesday bench in Weeks 6-7 has one controlled command-pause single before its preserved
    double and three backoff fours; meet-week Monday bench uses one easy command single instead of its double.
    Squat/sumo still use doubles and triples without routine singles; nine competition attempts remain singles.
    Post-squat warm-ups, a genuine pause and written RPE govern bench load. No second proof attempt after a
    miss, position failure or RPE overshoot. Singles are lift-specific skill practice, not required for strength.
  wave_structure: 'Week 4 is the hardest first-wave triple week (top @8-8.5). Week 5 is a modest reset (top @7-7.5,
    backoff fours remain); Weeks 6-7 rebuild with doubles and productive rep work. Week 8 reduces training fatigue
    before the December 12 meet. Do not chase a pre-meet test or keep lowering volume from Week 5 onward.'
  secondary_progression: 'Tempo squat, Tuesday paused sumo, Monday command bench, weighted pull-ups, primary incline DB,
    Saturday easy RDL/light squat/Spoto have RPE-governed directional starts that build toward Week 4, reset in Week 5,
    and build again in Weeks 6-7. Use like-for-like technique and equipment; if the next increment overshoots effort,
    repeat the prior successful load rather than force it. External pull-up load and per-hand DB loads are identified
    explicitly. An easier Week 5 is intentional, not loss of progress.'
  accessory_double_progression: 'For each unanchored cable, dumbbell or machine accessory in Weeks 2-4 and 6-7, first
    complete the written sets/reps at its RPE with controlled ROM on the same setup. When all sets are at or below the
    middle of the RPE band with repeatable form, take the smallest available stack/DB increment next exposure while
    keeping the written reps and RPE ceiling; otherwise repeat the load and improve rep quality. Week 5 eases effort
    by about half an RPE point where applicable, not by adding sets or chasing failure. Week 7 has two sets by design;
    Week 8 has only the listed easy support. Machines are calibrated locally, never assigned cross-machine kg.'
  accessory_set_rule: 'Weeks 1-6: three sets for every programmed accessory except RDL, which has two. Pull-ups
    and primary incline DB are separate goals with their own wave progressions. Week 7: two accessory sets,
    including two RDL sets, while primary SBD work stays normal. Week 8: two easy sets of retained Monday leg extension/hip
    thrust and Tuesday row; omit RDL, Thursday isolates and other omitted slots. Do not add movements or make up
    skipped work.'
  week_1: 'Easy, rep-rich post-mock re-entry rather than an all-week minimal dose: original top triples and RPE
    unchanged; two five-rep primary backoffs, three easy command-bench fives with a lower anchor, two light-squat
    fours and two Spoto fives. Tempo and paused sumo retain their original introductory dose. Accessories use three
    easy sets, RDL two. All load anchors yield to the written effort and position cap.'
exercise_variations:
  squat: Tempo Squat (Barbell) REPLACES Monday high bar. Use the same wider low-bar competition stance and shoes,
    three-second controlled descent to legal depth, normal strong ascent; do not force maximal knee-forward travel.
    Wednesday and Saturday low bar yield three weekly exposures.
  deadlift: Tuesday paused-at-knee sumo retains positional triples (three sets already in Weeks 2-7). Completed Week 1
    included two Tuesday RDL sixes; in Weeks 2-7 those TWO easy RDL sixes move immediately after Saturday's competition
    sumo top set and two backoffs, before light squat and Spoto, at unchanged load/RPE. Meet-week Tuesday has low-fatigue
    competition doubles/backoffs without RDL. Remove Saturday RDL first if it compromises the remaining lifts or Monday
    tempo squat. No new hinge variations or extra pulling days.
  bench: Completed Week 1 Monday primary bench and Wednesday easy commands remain historical. In Weeks 2-7 Monday
    tempo squat precedes secondary command bench (rising anchors, RPE 6-7), Tuesday primary incline DB follows pulls,
    Wednesday primary squat precedes PRIMARY competition bench top triple/double and backoffs with genuine commands;
    Weeks 6-7 add one bounded command-pause bench single BEFORE the existing double. Saturday Spoto follows
    sumo/RDL/light squat. Meet-week Monday REPLACES its easy bench double with one easy command single, leaving
    the three fours intact; Wednesday keeps two easy fours. No hard opener test or added proof attempt.
  adductor: 'Use one hip-adductor option per week, not both: Hip adductor (Rowerg) on Wednesday at Back Alley Barbell
    in even development weeks; Hip Adductor (Machine) on Thursday at the condo in odd development weeks. Exact custom
    RowErg capitalization is case-sensitive.'
condo_policy: Monday is three gym movements plus two condo movements (leg extension and hip thrust), an explicit
  exception to the four-movement cap. Wednesday RowErg adductor is gym-only; Thursday condo machine adductor occurs
  on alternate weeks, never in the same week. Week 1 Saturday is only sumo, low-bar squat and Spoto; Weeks 2-7 add
  two easy RDL sets immediately after sumo backoffs, before squat and Spoto, at Ren's explicit requested order. No
  condo hip thrust after. Log condo work under Monday/Thursday. Keep hip/adductor work low-soreness.
meet_policy: Local competition, 83kg class with no cut planned; weigh-in and federation details to confirm before
  attempt-day logistics. Do not assume mock-meet attempts are white-light legal.
workload_summary:
  scope_note: 'Expected barbell SBD-family workload, including the listed variations. This is not all-exercise gym
    tonnage: RDL, incline dumbbells, pull-ups and machines are excluded. Competition attempts are shown in the session
    plan but excluded from pre-meet training comparisons.'
  families:
    Squat:
    - Squat (Low Bar)
    - Tempo Squat (Barbell)
    Bench:
    - Bench Press (Barbell)
    - Spoto Press
    Deadlift:
    - Sumo Deadlift (Barbell)
    - Sumo Deadlift (Paused)
  plate_increment_kg: 2.5
  exclude_workouts:
  - week: 8
    day: 5
    reason: Grinchmas competition attempts; not pre-meet training
