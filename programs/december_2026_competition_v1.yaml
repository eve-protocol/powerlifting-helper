name: December 2026 Competition - Ren v1
description: Eight-week meet-specific cycle built from the athlete-calibrated 5-week top-triple progression in REN_3.xlsx;
  three squat exposures including same-stance tempo, Tuesday primary incline with paused sumo and RDL backoffs,
  Saturday heavy sumo, Thursday condo accessories, Friday rest. Proposal for review, not Boostcamp-synced.
weeks: 8
days_per_week: 5
planned_start_date: '2026-10-19'
competition_date: '2026-12-12'
schedule:
  monday: Primary competition bench / same-wide-stance tempo squat / weighted pull-ups; condo leg extension and
    hip thrust later
  tuesday: Paused-at-knee sumo / primary incline dumbbell / easy Romanian-deadlift backoffs / supported row
  wednesday: Heavy low bar then low-cost competition bench commands; pull-ups and gym-only RowErg adductor on alternate
    weeks
  thursday: 'Condo-only accessories: chest, shoulders, arms and machine adductor on alternate weeks'
  friday: Full rest before heavy deadlift
  saturday: 'Barbell SBD only: heavy sumo then light low bar then Spoto bench'
  sunday: Rest
loading_guidance:
  e1rm_proxy_kg:
    squat_low_bar: 180
    competition_bench: 142.5
    sumo_deadlift: 200
  proxy_scope: 'Squat 180 and bench 142.5 are October 17 reported singles with unverified meet legality. Deadlift
    200 is Ren-selected historical successful single (2025-08-25 synced), NOT an October 17 make: 190 was made and
    200 missed then. These are initial input proxies, NOT measured current e1RMs. Recalibrate from Week 1 actual
    effort; percentage ranges never override RPE or position.'
  top_triples_weeks_1_to_5:
  - week: 1
    rpe: 6.5
    e1rm_pct_range:
    - 0.81
    - 0.835
    backoff_multiplier_of_actual_top_set: 0.9
  - week: 2
    rpe: 7
    e1rm_pct_range:
    - 0.825
    - 0.85
    backoff_multiplier_of_actual_top_set: 0.9
  - week: 3
    rpe: 7.5
    e1rm_pct_range:
    - 0.84
    - 0.865
    backoff_multiplier_of_actual_top_set: 0.89
  - week: 4
    rpe: 8
    e1rm_pct_range:
    - 0.855
    - 0.88
    backoff_multiplier_of_actual_top_set: 0.88
  - week: 5
    rpe: 8.5
    e1rm_pct_range:
    - 0.87
    - 0.895
    backoff_multiplier_of_actual_top_set: 0.86
  backoff_rule: For Monday bench, Wednesday squat and Saturday sumo, derive backoff load from ACTUAL top triple,
    round to 2.5kg, and check target RPE. The numerical backoff in a workout is only an illustrative anchor if the
    suggested top set is actually used.
  day_to_day_rule: Use the range as a starting estimate and adjust to the written RPE and legal lift quality; the
    historical 200kg deadlift input is not a current max guarantee. No proof retries after a miss. Machine anchors
    are omitted pending local setup calibration.
  week_6: Competition singles @7-8 followed by limited doubles/triples; do not turn this into a max test.
  week_7: Final heavy controlled bench Monday, squat Wednesday, deadlift Saturday, singles @8-8.5 maximum PLUS two
    bounded backoff sets each; keep at least half of Week 6 training volume across work sets, barbell reps and illustrative
    tonnage.
  week_8: Confidence-preserving MON/WED competition bench/squat singles and TUE sumo single @7-8, then useful low-RPE
    rep work. Monday familiar tempo, pull-ups and two easy condo machines; Tuesday incline and row; Wednesday a
    little bench and pull-ups. No hard work Thursday/Friday. Week 8 pre-meet training holds approximately half of
    Week 6 work sets, barbell reps and indicative tonnage; meet attempts are excluded.
exercise_variations:
  squat: Tempo Squat (Barbell) REPLACES Monday high bar. Use the same wider low-bar competition stance and shoes,
    three-second controlled descent to legal depth, normal strong ascent; do not force maximal knee-forward travel.
    Wednesday and Saturday low bar yield three weekly exposures.
  deadlift: Sumo Deadlift (Paused) at knee remains Tuesday for knee-to-lockout; Romanian Deadlift (Barbell) is an
    easy 1-2 set BACKOFF directly afterward Weeks 1-6, not another hard primary pull. If Wednesday squat quality
    deteriorates, remove the RDL backoff rather than add it to Saturday. B-stance, unilateral and Zercher are not
    concurrently added.
  bench: Primary competition bench Monday BEFORE tempo squat, PRIMARY incline DB after Tuesday pulls, controlled
    command-style competition bench Wednesday after squat, Spoto Saturday. Close-grip from friend sheet replaced
    by competition pause practice.
  adductor: 'Use one hip-adductor option per week, not both: Hip adductor (Rowerg) on Wednesday at Back Alley Barbell
    in even development weeks; Hip Adductor (Machine) on Thursday at the condo in odd development weeks. Exact custom
    RowErg capitalization is case-sensitive.'
condo_policy: Monday is three gym movements plus two condo movements (leg extension and hip thrust), an explicit
  exception to the four-movement cap. Wednesday RowErg adductor is gym-only; Thursday condo machine adductor occurs
  on alternate weeks, never in the same week. Saturday is ONLY sumo, low-bar squat and Spoto bench; no condo hip
  thrust after. Log condo work under Monday/Thursday. Keep hip/adductor work low-soreness to protect next primary
  squat and Saturday sumo.
meet_policy: Local competition, 83kg class with no cut planned; weigh-in and federation details to confirm before
  attempt-day logistics. Do not assume mock-meet attempts are white-light legal.
