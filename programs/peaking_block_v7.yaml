name: Peaking Block v7
description: '4-week realization/peaking block. All lifts competition-specific — no
  squat variations, no Larsen. Heavy singles ramp across the block toward mock meet.
  Week 3 is the final heavy practice week: RPE-based singles are intended to rehearse
  opener/second-attempt execution, followed by controlled backoff doubles. Week 4
  is a mock-meet realization week with openers Monday, easy-but-loaded squat/bench
  practice midweek, and full mock meet Saturday rather than an aggressive taper.
  Incline DB stays weeks 1-2 then drops out. Paused bench and paused deadlift serve
  as lighter technique work. Monday stays upper-focused with light low bar to preserve
  the Saturday→Monday recovery fix.'
