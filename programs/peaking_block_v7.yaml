name: Peaking Block v7
description: '4-week realization block following 5RM accumulation and 3RM transmutation. Specificity rises while volume falls: practice singles, opener/second rehearsal, taper, and mock meet. Incline DB bench remains as an important separate bench-variation exposure early in the peak, then tapers. Heavy deadlift remains Tuesday and repeated failed/grindy singles are intentionally avoided. Exercise order is intentional: the main lift or named variation is first each day; taper days keep fewer exercises on purpose.'
