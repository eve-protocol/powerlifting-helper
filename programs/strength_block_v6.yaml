name: Strength Block v6
description: Three-week athlete-specific intensification block that preserves meaningful rep work. Week 1 transitions through
  competition-lift fours without singles, Week 2 uses one deliberately submaximal single before triples, and Week 3 tests
  objective triple benchmarks without a calibration single. High bar, paused bench, incline DB, Spoto, pull-ups twice weekly,
  and backoff work remain in place. Paused sumo at the top edge of the kneecap trains Ren's transition into lockout.
weeks: 3
days_per_week: 5
planned_start_date: '2026-09-07'
planned_end_date: '2026-09-26'
load_policy:
  target_weight_role: Anchor from completed volume benchmarks and Ren's history; never override live RPE, pain, or position.
  single_rule: Only Week 2 contains singles. They are technique exposures capped at RPE 7-7.5; no escalation when the anchor
    lands inside the range and no proof attempts.
  benchmark_rule: Week 3 target triples use normal warm-ups, not a programmed single at or near the target load.
workouts:
- week: 1
  day: 1
  name: Monday - High Bar / Paused Bench / Pull-Ups
  intent: Retain rep strength and developmental squat work while competition intensity rises.
  priority: required
  exercises:
  - name: High Bar Squat (Barbell)
    intent: Keep knee-forward quad development active through intensification.
    role: developmental_squat
    sets:
    - target: 5
      rpe:
      - 6.5
      - 7
      target_weight_kg: 125
    - target: 5
      rpe:
      - 6.5
      - 7
      target_weight_kg: 125
    - target: 5
      rpe:
      - 6.5
      - 7
      target_weight_kg: 125
  - name: Bench Press (Paused)
    intent: Keep long-pause bench volume active as competition work intensifies.
    role: primary_bench
    sets:
    - target: 4
      rpe:
      - 7
      - 7.5
      target_weight_kg: 110
    - target: 4
      rpe:
      - 7
      - 7.5
      target_weight_kg: 110
    - target: 4
      rpe:
      - 7
      - 7.5
