name: Strength Block v6
description: Four-week athlete-specific intensification block that preserves meaningful rep work. High bar, paused bench,
  incline DB, pull-ups twice weekly, and backoff triples/fours remain in place while competition singles calibrate rather
  than test. Paused sumo moves to the top edge of the kneecap to train the transition into Ren's lockout limiter. Week 4 uses
  objective triple benchmarks and no target-load calibration single.
weeks: 4
days_per_week: 5
planned_start_date: '2026-08-31'
planned_end_date: '2026-09-26'
load_policy:
  target_weight_role: Anchor from completed volume benchmarks and Ren's history; never override live RPE, pain, or position.
  single_rule: Singles calibrate backoff work and stop at the prescribed set. No extra proof attempts.
  benchmark_rule: Week 4 target triples use normal warm-ups, not a programmed single at or near the target load.
workouts:
- week: 1
  day: 1
  name: Monday - High Bar / Paused Bench / Pull-Ups
  intent: Retain rep strength and developmental squat work while competition intensity rises.
  priority: required
  exercises:
  - name: High Bar Squat (Barbell)
    intent: Keep knee-forward quad development active through intensification.
    role: developmental_squat
    sets:
    - target: 5
      rpe:
      - 6.5
      - 7
      target_weight_kg: 125
    - target: 5
      rpe:
      - 6.5
      - 7
      target_weight_kg: 125
    - target: 5
      rpe:
      - 6.5
      - 7
      target_weight_kg: 125
  - name: Bench Press (Paused)
    intent: Keep long-pause bench volume active as competition work intensifies.
    role: primary_bench
    sets:
    - target: 4
      rpe:
      - 7
      - 7.5
      target_weight_kg: 110
    - target: 4
      rpe:
      - 7
      - 7.5
      target_weight_kg: 110
    - target: 4
      rpe:
      - 7
      - 7.5
      target_weight_kg: 110
  - name: Pull-Up (Weighted)
    intent: Progress weighted pull-up strength without compromising the next primary lift.
    role: secondary_goal
    sets:
    - target: 5
      rpe:
      - 7.5
      - 8
      target_weight_kg: 27.5
    - target: 5
      rpe:
      - 7.5
      - 8
      target_weight_kg: 27.5
    - target: 5
      rpe:
      - 7.5
      - 8
      target_weight_kg: 27.5
  - name: Cable Crunch
    intent: Maintain trunk strength without interfering with primary lifts.
    role: accessory
    sets:
    - target: 12
      rpe:
      - 7
      - 7.5
      target_weight_kg: 45
    - target: 12
      rpe:
      - 7
      - 7.5
      target_weight_kg: 45
    - target: 12
      rpe:
      - 7
      - 7.5
      target_weight_kg: 45
    equipment_dependent: true
- week: 1
