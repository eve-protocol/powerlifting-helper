name: Volume Block v7
description: Five-week athlete-specific accumulation block. Weeks 1-3 retain the high-rep structure that produced Ren's best
  cycle results, Week 4 uses objective five-rep benchmarks, and Week 5 is a meaningful relocation bridge with a strict no-compression
  rule. Incline DB bench is a primary bench movement, weighted pull-ups are trained twice weekly, high bar is retained, pause
  squat is removed, and RDLs build hip-extension capacity.
weeks: 5
days_per_week: 5
cycle_start_date: '2026-07-27'
planned_end_date: '2026-08-29'
load_policy:
  target_weight_role: Anchor from Ren's history; RPE, pain, technique, and equipment decide the live load.
  default_adjustment_kg:
    barbell_main_lift: 2.5
    deadlift: 5
    dumbbell_per_hand: 2.5
  no_forced_load_rule: Never force target_weight_kg when the first work set exceeds the RPE ceiling or loses the day's required
    position.
relocation_policy:
  dates: 2026-08-24 to 2026-08-29
  rule: Do not catch up, double, or compress missed sessions. Mark omitted work and continue in order.
  equipment_rule: Machine anchors are Japan references only until Toronto equipment is calibrated.
first_session_context:
  date: '2026-07-27'
  note: The written anchors describe a normal Week 1. Live coaching must adjust because this session follows the 2026-07-26 mock meet.
