name: Validate and Sync Programs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "programs/*.yaml"
      - "programs/*.yml"
  push:
    branches: [main]
    paths:
      - "programs/*.yaml"
      - "programs/*.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml jsonschema requests

      - name: Validate YAML schema
        run: python scripts/validate_programs.py

      - name: Show program changes
        run: python scripts/show_changes.py
        env:
          BOOSTCAMP_REFRESH_TOKEN: ${{ secrets.BOOSTCAMP_REFRESH_TOKEN }}

  sync:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Generate program docs from YAML
        run: python scripts/generate_program_docs.py

      - name: Commit generated docs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add outputs/*.md
          git diff --staged --quiet || git commit -m "Generate program docs from YAML [skip ci]"
          git push

      - name: Sync programs to Boostcamp
        run: python scripts/sync_programs.py
        env:
          BOOSTCAMP_REFRESH_TOKEN: ${{ secrets.BOOSTCAMP_REFRESH_TOKEN }}