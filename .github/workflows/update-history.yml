name: Update Boostcamp History

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests google-auth pyzipper

      - name: Create refresh token file
        run: echo "${{ secrets.BOOSTCAMP_REFRESH_TOKEN }}" > scripts/.boostcamp_refresh_token

      - name: Fetch and parse history
        run: python scripts/parse_history.py --fetch

      - name: Fetch Health Connect export
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HEALTH_CONNECT_DRIVE_FILE_ID: ${{ secrets.HEALTH_CONNECT_DRIVE_FILE_ID }}
        run: |
          python scripts/fetch_health_connect.py \
            --output /tmp/health-connect.zip \
            --metadata-output /tmp/health-connect-meta.json
          unzip -q -o /tmp/health-connect.zip -d /tmp/health-connect
          python scripts/export_health_daily.py \
            --db /tmp/health-connect/health_connect_export.db \
            --metadata /tmp/health-connect-meta.json \
            --output values/health_daily.json

      - name: Fetch Zepp body-weight export
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ZEPP_BODY_DRIVE_FILE_ID: ${{ secrets.ZEPP_BODY_DRIVE_FILE_ID }}
          ZEPP_BODY_ZIP_PASSWORD: ${{ secrets.ZEPP_BODY_ZIP_PASSWORD }}
        run: |
          if [ -z "$ZEPP_BODY_DRIVE_FILE_ID" ] || [ -z "$ZEPP_BODY_ZIP_PASSWORD" ]; then
            echo "Skipping Zepp body-weight fetch, missing ZEPP_BODY_DRIVE_FILE_ID or ZEPP_BODY_ZIP_PASSWORD"
            exit 0
          fi
          python scripts/fetch_health_connect.py \
            --file-id-env ZEPP_BODY_DRIVE_FILE_ID \
            --output /tmp/zepp-body.zip \
            --metadata-output /tmp/zepp-body-meta.json
          python scripts/export_zepp_body_weight.py \
            --zip /tmp/zepp-body.zip \
            --password "$ZEPP_BODY_ZIP_PASSWORD" \
            --metadata /tmp/zepp-body-meta.json \
            --output values/body_weight_history.json

      - name: Generate 12-week history
        run: python scripts/generate_12_weeks.py

      - name: Generate historical RPE table
        run: python scripts/generate_rpe_table.py

      - name: Generate clean history (AI-friendly)
        run: python scripts/export_clean_history.py

      - name: Generate body-weight graph
        run: python scripts/render_body_weight_graph.py

      - name: Generate body-weight history summary
        run: python scripts/render_body_weight_history.py

      - name: Generate merged body-weight timeline
        run: python scripts/render_body_weight_timeline.py

      - name: Remove sensitive files
        run: rm -f scripts/.boostcamp_refresh_token scripts/.boostcamp_token

      - name: Commit and push history changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add values/history.json values/body_weight_history.json outputs/history.md outputs/12_last_weeks_history.md outputs/rpe_table.md outputs/history_clean.md outputs/body_weight_history.md outputs/body_weight_history.svg outputs/body_weight_timeline.md outputs/body_weight_timeline.csv outputs/scorecard_weekly.md outputs/scorecard_monthly.md outputs/scorecard_quarterly.md outputs/scorecard_yearly.md
          git diff --staged --quiet || git commit -m "Update workout history [skip ci]"
          git push
