name: Update Boostcamp History

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout private backfill data
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.PRIVATE_DATA_REPO }}
          token: ${{ secrets.PRIVATE_DATA_REPO_TOKEN }}
          path: private-data

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create refresh token file
        run: echo "${{ secrets.BOOSTCAMP_REFRESH_TOKEN }}" > scripts/.boostcamp_refresh_token

      - name: Fetch and parse history
        run: python scripts/parse_history.py --fetch

      - name: Fetch Health Connect export
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HEALTH_CONNECT_DRIVE_FILE_ID: ${{ secrets.HEALTH_CONNECT_DRIVE_FILE_ID }}
        run: |
          python scripts/fetch_health_connect.py \
            --output /tmp/health-connect.zip \
            --metadata-output /tmp/health-connect-meta.json
          unzip -q -o /tmp/health-connect.zip -d /tmp/health-connect
          python scripts/export_health_daily.py \
            --db /tmp/health-connect/health_connect_export.db \
            --metadata /tmp/health-connect-meta.json \
            --output values/health_daily.json

      - name: Copy static Zepp and Garmin backfill data from private repo
        run: |
          test -f private-data/values/body_weight_history.json
          test -f private-data/values/garmin_daily.json
          cp private-data/values/body_weight_history.json values/body_weight_history.json
          cp private-data/values/garmin_daily.json values/garmin_daily.json

      - name: Generate 12-week history
        run: python scripts/generate_12_weeks.py

      - name: Generate historical RPE table
        run: python scripts/generate_rpe_table.py

      - name: Generate clean history (AI-friendly)
        run: python scripts/export_clean_history.py

      - name: Generate merged body-weight timeline
        run: python scripts/render_body_weight_timeline.py

      - name: Remove sensitive files
        run: rm -f scripts/.boostcamp_refresh_token scripts/.boostcamp_token

      - name: Commit and push history changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          rm -f outputs/body_weight_history.svg outputs/body_weight_timeline.csv outputs/body_weight_history.md outputs/body_weight_timeline_chart_e1rm.png outputs/body_weight_timeline_chart_actual.png
          git add -A values/history.json outputs/history.md outputs/12_last_weeks_history.md outputs/rpe_table.md outputs/history_clean.md outputs/body_weight_timeline.md outputs/scorecard_weekly.md outputs/scorecard_monthly.md outputs/scorecard_quarterly.md outputs/scorecard_yearly.md scripts
          git diff --staged --quiet || git commit -m "Update workout history [skip ci]"
          git push
