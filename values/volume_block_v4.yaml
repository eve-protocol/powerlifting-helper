name: "Volume Block v4"
description: "3-week volume block with RPE-based autoregulation. Heavy Squat/Bench/Deadlift with variations. Updated via API."
weeks: 3
days_per_week: 5

# Week 1: RPE 6-7 (Introduction)
# Week 2: RPE 7-7.5 (Building)
# Week 3: RPE 7.5-8 + AMRAP 8.5-9 (Consolidation)

